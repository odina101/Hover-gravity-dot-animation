<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Dots Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="dotCanvas"></canvas>

  <div class="content" id="content">
    <h1>Gravity Dots</h1>
    <p class="subtitle">Animation</p>
  </div>

  <div class="shape-picker">
    <button class="shape-btn active" data-shape="box">Box</button>
    <button class="shape-btn" data-shape="heart">Heart</button>
    <button class="shape-btn" data-shape="circle">Circle</button>
    <button class="shape-btn" data-shape="star">Star</button>
    <button class="shape-btn" data-shape="diamond">Diamond</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
